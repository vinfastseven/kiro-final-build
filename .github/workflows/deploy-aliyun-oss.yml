# 阿里云 OSS 部署工作流
#
# 功能说明：
# - 自动构建 VitePress 站点
# - 部署到阿里云 OSS（对象存储）
# - 适用于静态网站托管
#
# 配置要求：
# 需要在 GitHub 仓库的 Settings > Secrets and variables > Actions 中配置以下 secrets：
# - OSS_REGION: OSS 地域（如 oss-cn-hangzhou）
# - OSS_ACCESS_KEY_ID: 阿里云访问密钥 ID
# - OSS_ACCESS_KEY_SECRET: 阿里云访问密钥 Secret
# - OSS_BUCKET: OSS 存储桶名称
# - OSS_PREFIX: 上传路径前缀（可选）

name: Deploy to Aliyun OSS

# 触发条件
on:
  # 推送到 main 分支时触发
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - '.vitepress/**'
      - package.json
      - pnpm-lock.yaml

  # 支持手动触发
  workflow_dispatch:

jobs:
  deploy:
    name: Build and Deploy to OSS
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取所有历史记录，用于显示最后更新时间

      # 2. 设置 Node.js 环境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. 设置 pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      # 4. 获取 pnpm store 目录
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      # 5. 缓存 pnpm 依赖
      - name: Cache pnpm dependencies
        uses: actions/cache@v3
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # 6. 安装依赖
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # 7. 构建站点
      - name: Build VitePress Site
        run: pnpm run build
        env:
          # 设置基准路径（根据你的 OSS 配置调整）
          VITE_BASE: /
          # 设置站点 URL（替换为你的 OSS 自定义域名或 Bucket 域名）
          VITE_SITE_URL: https://your-bucket.oss-cn-hangzhou.aliyuncs.com

      # 8. 部署到阿里云 OSS
      - name: Deploy to Aliyun OSS
        run: node scripts/deploy-oss.js
        env:
          OSS_REGION: ${{ secrets.OSS_REGION }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_PREFIX: ${{ secrets.OSS_PREFIX }}

      # 9. 输出部署结果
      - name: Deployment Summary
        run: |
          echo "## 🎉 部署成功！" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 部署信息" >> $GITHUB_STEP_SUMMARY
          echo "- **存储桶**: ${{ secrets.OSS_BUCKET }}" >> $GITHUB_STEP_SUMMARY
          echo "- **地域**: ${{ secrets.OSS_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **提交**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **分支**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 访问地址" >> $GITHUB_STEP_SUMMARY
          echo "🌐 https://${{ secrets.OSS_BUCKET }}.${{ secrets.OSS_REGION }}.aliyuncs.com" >> $GITHUB_STEP_SUMMARY
