# Docker 镜像构建与推送工作流
#
# 功能：自动构建 Docker 镜像并推送到云镜像仓库
# - 腾讯云容器镜像服务 (CCR)
# - 阿里云容器镜像服务 (ACR)
# - Docker Hub（可选）
#
# 触发条件：
# - push 到 main 分支（带标签时）
# - 创建 release
# - 手动触发

name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  release:
    types: [published]
  workflow_dispatch:

env:
  # 镜像名称
  IMAGE_NAME: vitepress-docs

jobs:
  # Job 1: 构建 Docker 镜像
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        run: |
          # 提取版本号
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          elif [[ $GITHUB_REF == refs/heads/main ]]; then
            VERSION=latest
          else
            VERSION=${GITHUB_SHA::8}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ steps.meta.outputs.date }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}

      - name: Test Docker image
        run: |
          docker run -d -p 8080:80 --name test-container ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          sleep 5
          curl -f http://localhost:8080 || exit 1
          docker stop test-container
          docker rm test-container

      - name: Save Docker image
        run: |
          docker save ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }} | gzip > image.tar.gz

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar.gz
          retention-days: 1

  # Job 2: 推送到腾讯云 CCR
  push-tencent-cloud:
    name: Push to Tencent Cloud CCR
    needs: build-docker
    runs-on: ubuntu-latest
    if: ${{ secrets.TENCENT_CLOUD_SECRET_ID != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: |
          docker load < image.tar.gz

      - name: Extract metadata
        id: meta
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          elif [[ $GITHUB_REF == refs/heads/main ]]; then
            VERSION=latest
          else
            VERSION=${GITHUB_SHA::8}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Login to Tencent Cloud CCR
        run: |
          docker login ccr.ccs.tencentyun.com \
            --username=${{ secrets.TENCENT_CLOUD_SECRET_ID }} \
            --password=${{ secrets.TENCENT_CLOUD_SECRET_KEY }}

      - name: Tag and push to CCR
        run: |
          # 主镜像仓库地址
          CCR_REGISTRY="${{ secrets.TENCENT_CCR_REGISTRY || 'ccr.ccs.tencentyun.com' }}"
          CCR_NAMESPACE="${{ secrets.TENCENT_CCR_NAMESPACE || 'vitepress' }}"

          # 标记镜像
          docker tag ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }} \
            ${CCR_REGISTRY}/${CCR_NAMESPACE}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

          # 如果是 latest，也推送带版本号的标签
          if [ "${{ steps.meta.outputs.version }}" = "latest" ]; then
            docker tag ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }} \
              ${CCR_REGISTRY}/${CCR_NAMESPACE}/${{ env.IMAGE_NAME }}:$(date +%Y%m%d)
            docker push ${CCR_REGISTRY}/${CCR_NAMESPACE}/${{ env.IMAGE_NAME }}:$(date +%Y%m%d)
          fi

          # 推送镜像
          docker push ${CCR_REGISTRY}/${CCR_NAMESPACE}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

      - name: Logout from CCR
        if: always()
        run: docker logout ccr.ccs.tencentyun.com

  # Job 3: 推送到阿里云 ACR
  push-aliyun-cloud:
    name: Push to Aliyun Cloud ACR
    needs: build-docker
    runs-on: ubuntu-latest
    if: ${{ secrets.ALIYUN_REGISTRY_USERNAME != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: |
          docker load < image.tar.gz

      - name: Extract metadata
        id: meta
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          elif [[ $GITHUB_REF == refs/heads/main ]]; then
            VERSION=latest
          else
            VERSION=${GITHUB_SHA::8}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Login to Aliyun ACR
        run: |
          docker login registry.cn-hangzhou.aliyuncs.com \
            --username=${{ secrets.ALIYUN_REGISTRY_USERNAME }} \
            --password=${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Tag and push to ACR
        run: |
          # 主镜像仓库地址（默认杭州区域）
          ACR_REGISTRY="${{ secrets.ALIYUN_ACR_REGISTRY || 'registry.cn-hangzhou.aliyuncs.com' }}"
          ACR_NAMESPACE="${{ secrets.ALIYUN_ACR_NAMESPACE || 'vitepress' }}"

          # 标记镜像
          docker tag ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }} \
            ${ACR_REGISTRY}/${ACR_NAMESPACE}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

          # 如果是 latest，也推送带版本号的标签
          if [ "${{ steps.meta.outputs.version }}" = "latest" ]; then
            docker tag ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }} \
              ${ACR_REGISTRY}/${ACR_NAMESPACE}/${{ env.IMAGE_NAME }}:$(date +%Y%m%d)
            docker push ${ACR_REGISTRY}/${ACR_NAMESPACE}/${{ env.IMAGE_NAME }}:$(date +%Y%m%d)
          fi

          # 推送镜像
          docker push ${ACR_REGISTRY}/${ACR_NAMESPACE}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

      - name: Logout from ACR
        if: always()
        run: docker logout registry.cn-hangzhou.aliyuncs.com

  # Job 4: 推送到 Docker Hub（可选）
  push-docker-hub:
    name: Push to Docker Hub
    needs: build-docker
    runs-on: ubuntu-latest
    if: ${{ secrets.DOCKERHUB_USERNAME != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: |
          docker load < image.tar.gz

      - name: Extract metadata
        id: meta
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          elif [[ $GITHUB_REF == refs/heads/main ]]; then
            VERSION=latest
          else
            VERSION=${GITHUB_SHA::8}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push to Docker Hub
        run: |
          DOCKERHUB_REPO="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"

          # 标记镜像
          docker tag ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }} \
            ${DOCKERHUB_REPO}:${{ steps.meta.outputs.version }}

          # 推送镜像
          docker push ${DOCKERHUB_REPO}:${{ steps.meta.outputs.version }}

          # 如果是正式版本，也推送 latest 标签
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            docker tag ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }} ${DOCKERHUB_REPO}:latest
            docker push ${DOCKERHUB_REPO}:latest
          fi

  # Job 5: 清理和通知
  cleanup:
    name: Cleanup and Notify
    needs: [push-tencent-cloud, push-aliyun-cloud, push-docker-hub]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check push status
        run: |
          echo "::notice::Docker image push completed!"
          echo "Tencent Cloud CCR: ${{ needs.push-tencent-cloud.result }}"
          echo "Aliyun Cloud ACR: ${{ needs.push-aliyun-cloud.result }}"
          echo "Docker Hub: ${{ needs.push-docker-hub.result }}"

      - name: Clean up artifacts
        uses: geekyeggo/delete-artifact@v4
        with:
          name: docker-image
